spring.application.name=connector
server.port=5556

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}

spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=32768
spring.kafka.producer.properties.linger.ms=5

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.connector.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ru.connector.api.dto.SubscriptionDto
spring.kafka.consumer.properties.group.instance.id=${KAFKA_GROUP_INSTANCE_ID:connector-node-1}
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

kafka.topics.raw=market.data.raw
kafka.topics.subscription-state=market.subscriptions

logging.level.root=WARN
logging.level.ru.connector=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%-5level] [%thread] %logger{25} - %msg%n
openapi: 3.0.3
info:
  title: DataCollector Platform API
  description: Контрактная спецификация взаимодействия между клиентами, Control Plane и Ingestor
  version: 1.0.0

tags:
  - name: Auth
    description: Аутентификация и управление сессиями
  - name: Subscriptions
    description: Управление жизненным циклом подписок на потоки данных

paths:
  # ==========================================
  # АУТЕНТИФИКАЦИЯ
  # ==========================================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      operationId: register
      requestBody:
        required: true
        description: Учетные данные нового пользователя
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему (установка HttpOnly Cookies с JWT)
      operationId: login
      requestBody:
        required: true
        description: Учетные данные для входа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse401'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы (очистка Cookies и отзыв refresh токена)
      operationId: logout
      responses:
        '204':
          description: Успешный выход

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Получение данных текущего авторизованного пользователя
      operationId: getCurrentUser
      responses:
        '200':
          description: Данные профиля текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse401'

  # ==========================================
  # ПОДПИСКИ
  # ==========================================
  /api/subscriptions:
    post:
      tags: [Subscriptions]
      summary: Создание подписки со сроком действия
      operationId: createSubscription
      requestBody:
        required: true
        description: Параметры создаваемой биржевой подписки
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Подписка успешно создана и поставлена в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '401':
          $ref: '#/components/responses/ErrorResponse401'

    get:
      tags: [Subscriptions]
      summary: Получение списка подписок текущего пользователя с фильтрацией
      operationId: getSubscriptions
      parameters:
        - name: status
          in: query
          description: Фильтрация по статусу подписки (ACTIVE, EXPIRED, CANCELLED)
          required: false
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - name: exchange
          in: query
          description: Фильтрация по наименованию биржи (например, KUCOIN)
          required: false
          schema:
            type: string
            example: "KUCOIN"
        - name: market
          in: query
          description: Фильтрация по типу рынка (SPOT или FUTURES)
          required: false
          schema:
            $ref: '#/components/schemas/MarketType'
      responses:
        '200':
          description: Список подписок пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'

  /api/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Получение деталей подписки по ID
      operationId: getSubscriptionById
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор подписки
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Детальная информация о подписке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse404'

    delete:
      tags: [Subscriptions]
      summary: Досрочная отмена подписки
      operationId: cancelSubscription
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор отменяемой подписки
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Подписка успешно отменена
        '404':
          $ref: '#/components/responses/ErrorResponse404'

# ==========================================
# МОДЕЛИ ДАННЫХ
# ==========================================
components:
  responses:
    ErrorResponse400:
      description: Некорректный запрос или ошибки валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse401:
      description: Пользователь не аутентифицирован или токен истек
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse404:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MarketType:
      type: string
      description: Тип финансового рынка
      enum: [SPOT, FUTURES]
      example: "SPOT"

    SubscriptionStatus:
      type: string
      description: Текущий статус жизненного цикла подписки
      enum: [ACTIVE, EXPIRED, CANCELLED]
      example: "ACTIVE"

    # Полиморфная команда потока
    Command:
      type: object
      description: Базовая полиморфная команда биржевого потока данных
      required:
        - type
      discriminator:
        propertyName: type
        mapping:
          trades: '#/components/schemas/TradesCommand'
          book_ticker: '#/components/schemas/BookTickerCommand'
          orderbook: '#/components/schemas/OrderBookCommand'
      properties:
        type:
          type: string
          description: Тип потока данных (дискриминатор)
      oneOf:
        - $ref: '#/components/schemas/TradesCommand'
        - $ref: '#/components/schemas/BookTickerCommand'
        - $ref: '#/components/schemas/OrderBookCommand'

    TradesCommand:
      description: Команда подписки на поток публичных сделок
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Тип команды (trades)
          example: "trades"

    BookTickerCommand:
      description: Команда подписки на поток лучших котировок покупки и продажи
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Тип команды (book_ticker)
          example: "book_ticker"

    OrderBookCommand:
      description: Команда подписки на поток биржевого стакана заявок (L2/L3)
      type: object
      required:
        - type
        - depth
      properties:
        type:
          type: string
          description: Тип команды (orderbook)
          example: "orderbook"
        depth:
          type: integer
          description: Глубина стакана заявок
          minimum: 1
          maximum: 100
          example: 50

    CreateSubscriptionRequest:
      type: object
      description: Запрос на создание новой подписки на биржевой поток
      required:
        - exchange
        - market
        - symbol
        - command
      properties:
        exchange:
          type: string
          description: Наименование биржи (например, KUCOIN)
          minLength: 1
          example: "KUCOIN"
        market:
          $ref: '#/components/schemas/MarketType'
        symbol:
          type: string
          description: Торговая пара в формате BASE-QUOTE
          pattern: '^[A-Z0-9]+[-_/][A-Z0-9]+$'
          example: "BTC-USDT"
        command:
          $ref: '#/components/schemas/Command'
        durationMinutes:
          type: integer
          description: Длительность подписки в минутах (сервер автоматически рассчитает expiresAt)
          minimum: 1
          example: 60

    SubscriptionResponse:
      type: object
      description: Ответ с информацией о подписке и ее статусе
      required:
        - id
        - exchange
        - market
        - symbol
        - command
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор подписки в базе данных
          example: 1
        exchange:
          type: string
          description: Наименование биржи
          example: "KUCOIN"
        market:
          $ref: '#/components/schemas/MarketType'
        symbol:
          type: string
          description: Торговая пара
          example: "BTC-USDT"
        command:
          $ref: '#/components/schemas/Command'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        createdAt:
          type: string
          format: date-time
          description: Время создания подписки (UTC)
        expiresAt:
          type: string
          format: date-time
          description: Расчетное время окончания действия подписки (UTC)

    AuthRequest:
      type: object
      description: Запрос аутентификации (логин и пароль)
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Имя пользователя (логин)
          minLength: 3
          maxLength: 32
          example: "test_user"
        password:
          type: string
          description: Пароль пользователя
          minLength: 6
          example: "securePassword123"

    UserResponse:
      type: object
      description: Данные профиля пользователя
      required:
        - id
        - username
        - role
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор пользователя
          example: 1
        username:
          type: string
          description: Имя пользователя
          example: "test_user"
        role:
          type: string
          description: Назначенная роль в системе
          example: "ROLE_USER"
        createdAt:
          type: string
          format: date-time
          description: Дата и время регистрации пользователя (UTC)

    ErrorResponse:
      type: object
      description: Стандартизированный ответ при возникновении ошибки
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Метка времени возникновения ошибки (UTC)
        status:
          type: integer
          description: Числовой код HTTP статуса
          example: 400
        error:
          type: string
          description: Краткое наименование HTTP ошибки
          example: "Bad Request"
        message:
          type: string
          description: Понятное описание причины ошибки
          example: "Validation error"
        path:
          type: string
          description: URI эндпоинта, на котором произошла ошибка
          example: "/api/subscriptions"
        details:
          type: array
          description: Список дополнительных деталей и сообщений валидации
          items:
            type: string
          example: ["symbol: Base asset cannot be blank"]
name: Баг-репорт
description: Сообщение о дефекте
title: "[BUG]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: verified
    attributes:
      label: Верификация
      options:
        - label: Баг проверен мной лично (не непроверенная гипотеза ИИ)

  - type: dropdown
    id: module
    attributes:
      label: Модуль
      options:
        - data-ingestor
        - control-plane
        - common
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Что сломано и где
      placeholder: Класс, строки, описание дефекта...
    validations:
      required: true
